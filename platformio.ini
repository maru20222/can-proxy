[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200
build_flags = -DUSB_SERIAL
build_src_filter = +<*> -<diag/>
lib_deps =
  https://github.com/collin80/FlexCAN_T4

; CAN1 <-> CAN3 双方向通信テスト（main.cpp の CAN_LOOPBACK_TEST）
;   .\monitor_upload.ps1 -Env cantest
[env:cantest]
extends = env:teensy41
build_flags = ${env:teensy41.build_flags} -DCAN_LOOPBACK_TEST

; 切り分け用（USB シリアル + LED のみ。CAN 不使用）
[env:diag]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200
build_flags = -DUSB_SERIAL
build_src_filter = +<diag/>

; 切り分け用: 実績のある旧プラットフォーム (Teensyduino 1.59 / GCC 11.3.1) で同じテストファームを作る
[env:diag_old]
platform = teensy@4.18.0
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200
build_flags = -DUSB_SERIAL
build_src_filter = +<diag/>
